# Hạ tầng lưu trữ cho hệ thống chatbot đa tác tử.
#   docker compose up -d neo4j qdrant seaweedfs          # hạ tầng mặc định (SQLite là file, không cần container)
#   docker compose --profile app up -d --build           # chạy toàn bộ: backend (/, /lab, /docs) + Cloudflare Tunnel
name: multiagent

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-multiagent-neo4j}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   # REST + dashboard (/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    # master + volume + filer + S3 gateway trong một tiến trình (đủ cho dev / demo)
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # Filer UI
      - "9333:9333"   # Master UI
    volumes:
      - seaweed:/data
      - ./src/storage/seaweedfs_s3.json:/etc/seaweedfs/s3.json:ro

  backend:
    profiles: ["app"]
    build: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: sqlite:////app/data/output/storage/db/multiagent.db
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      S3_ENDPOINT_URL: http://seaweedfs:8333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 10
    volumes:
      - ./src:/app/src
      - ./web/dist:/app/web/dist
      - ./data:/app/data
      - ./notebook:/app/notebook
      - ./app.py:/app/app.py
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      seaweedfs:
        condition: service_started

  # Cloudflare Tunnel: kết nối đi ra tới Cloudflare, không cần mở cổng. Public hostname
  # agent.nits.io.vn → http://localhost:8000 cấu hình trên Zero Trust dashboard.
  cloudflared:
    profiles: ["app"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Thiếu CLOUDFLARE_TUNNEL_TOKEN trong .env}
    network_mode: host
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4jdata:
  qdrantdata:
  sqlitedata:
  seaweed:
