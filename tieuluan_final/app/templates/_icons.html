{%- macro icon(name, size=18) -%}
<svg class="ic" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'history' -%}<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/>
{%- elif name == 'table' -%}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>
{%- elif name == 'image' -%}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>
{%- elif name == 'wave' -%}<path d="M3 12h3l2-6 4 12 3-9 2 3h4"/>
{%- elif name == 'graph' -%}<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7l7.5 0M7 8l4 8M16.5 9l-3.5 7"/>
{%- elif name == 'nodes' -%}<circle cx="5" cy="12" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="12" cy="19" r="2"/><path d="M7 11l3.5-4.5M14 6.5l3.5 4M17.5 13.5L14 17.5M10 17.5L6.5 13.5"/>
{%- elif name == 'agents' -%}<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V5M9 13h.01M15 13h.01M9 16.5h6"/><circle cx="12" cy="4" r="1"/>
{%- elif name == 'home' -%}<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>
{%- elif name == 'drop' -%}<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>
{%- else -%}<circle cx="12" cy="12" r="9"/>{%- endif -%}
</svg>
{%- endmacro -%}
